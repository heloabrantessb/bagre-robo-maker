# Publicação da plataforma no GitHub Pages.
# - Pull Requests para dev e main: verificações e build no Node.js 20.19 e 22, sem publicar.
# - Push na main e disparo manual a partir da main: verificações, build e publicação.
# Pré-requisito: Settings → Pages → Source = "GitHub Actions" (configurado pelo responsável).
name: Publicação no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Execuções antigas de um mesmo PR são canceladas; publicações na main nunca são interrompidas.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Verificações e build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Extremos da faixa declarada em package.json (engines: ^20.19.0 || >=22.12.0).
        node-version: ['20.19', '22']
    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar o ESLint
        run: npm run lint

      - name: Verificar funções de sequência dos módulos
        run: npm run verify:modules

      - name: Gerar o build de produção
        run: npm run build

      - name: Enviar o build como artefato do Pages
        if: matrix.node-version == '22' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
